<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi primera página con Metadata</title>
</head>

<body>

    <h1>Experiencia de Metadata</h1>
    <p>Ejemplo en japonés: ご飯が熱い。</p>
    <meta name="description" content="The Mozilla Developer Network (MDN) proporciona 
    información sobre tecnologías de código abierto que incluyen HTML, CSS y APIs 
    tanto para sitios web como para aplicaciones HTML5. También documenta productos
     Mozilla como el sistema operativo Firefox."> 
    <meta property="og:title" content="Experiencia de Metadata">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://ejemplo.com/imagen.jpg">
    <meta property="og:url" content="https://ejemplo.com">

    <meta name="twitter:card"
      content="summary_large_image">

    <meta name="twitter:title"
        content="Experiencia de Metadata">

    <meta name="twitter:description"
        content="Página web creada para practicar Metadata en HTML5.">

    <meta name="twitter:image"
        content="https://ejemplo.com/imagen.jpg">

</body>

</html>
